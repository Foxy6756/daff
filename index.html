<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flores en la noche</title>
  <style>
    :root {
      --bg-1: #0b1022;
      --bg-2: #1a1d3b;
      --gold: #ffd166;
      --gold-2: #ffea9e;
      --lavender: #d7cbff;
      --text: #f7f3ff;
      --panel: rgba(20, 22, 45, 0.78);
      --line: rgba(255, 255, 255, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 15%, rgba(255,255,255,0.75) 0 1.5px, transparent 2px),
        radial-gradient(circle at 82% 32%, rgba(255,255,255,0.8) 0 1.4px, transparent 2px),
        radial-gradient(circle at 30% 40%, rgba(255,255,255,0.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 60% 65%, rgba(255,255,255,0.7) 0 1.7px, transparent 2px),
        linear-gradient(180deg, #090d1d 0%, #131a36 25%, #221f45 65%, #0f132b 100%);
      background-size: 180px 180px, 220px 220px, 200px 200px, 240px 240px, 260px 260px, cover;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #fff, transparent),
        radial-gradient(2px 2px at 30% 60%, #fff, transparent),
        radial-gradient(2px 2px at 10% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 60% 20%, #fff, transparent),
        radial-gradient(2px 2px at 65% 50%, #fff, transparent),
        radial-gradient(2px 2px at 80% 70%, #fff, transparent),
        radial-gradient(2px 2px at 90% 30%, #fff, transparent),
        radial-gradient(2px 2px at 50% 90%, #fff, transparent);
      opacity: 0.9;
      pointer-events: none;
    }

    .container {
      width: min(980px, 92%);
      margin: 0 auto;
      padding: 60px 0 70px;
      position: relative;
      z-index: 1;
    }

    .letter {
      position: relative;
      max-width: 820px;
      margin: 0 auto;
      padding: 60px 8% 52px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.38),
        inset 0 0 30px rgba(193, 169, 255, 0.08);
      backdrop-filter: blur(6px);
    }

    .moon {
      position: absolute;
      top: 25px;
      right: 34px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff9cf, #f7e7ad);
      box-shadow: 0 0 30px rgba(255, 229, 128, 0.8);
    }

    .sparkle {
      font-size: 1.1rem;
      letter-spacing: 0.5rem;
      color: var(--gold-2);
      opacity: 0.9;
      margin-bottom: 10px;
    }

    h1 {
      margin: 12px 0 16px;
      font-size: clamp(2.6rem, 5vw, 4.8rem);
      line-height: 1.1;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.5);
    }

    .letter p {
      margin: 10px auto;
      font-size: 1.18rem;
      line-height: 1.7;
      color: var(--text);
      max-width: 600px;
    }

    .hint {
      color: var(--lavender);
      font-size: 0.95rem;
      margin-top: 16px;
    }

    .turntable {
      margin: 30px auto 12px;
      display: flex;
      justify-content: center;
    }

    .vinyl {
      width: 170px;
      height: 170px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at center, #3a3d5d 0 18%, #171926 18% 22%, #1f2439 22% 30%, #121827 30% 100%);
      box-shadow:
        0 0 0 10px #4d5178,
        0 0 30px rgba(0,0,0,0.45);
      position: relative;
      transition: transform 0.35s ease, box-shadow 0.35s ease, filter 0.35s ease;
      border: 3px solid rgba(255,255,255,0.08);
    }

    .vinyl::before {
      content: "";
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, #111827 0 6px, #20293d 7px 10px);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.06);
    }

    .vinyl::after {
      content: "▶";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 38px;
      color: #1e1a3b;
      z-index: 2;
    }

    .vinyl:hover {
      transform: scale(1.04) rotate(10deg);
      box-shadow:
        0 0 0 10px rgba(255, 209, 102, 0.9),
        0 0 38px rgba(255, 209, 102, 0.35);
    }

    .vinyl:active {
      transform: scale(0.98);
    }

    .vinyl.playing {
      animation: spin 2.4s linear infinite;
      box-shadow:
        0 0 0 10px rgba(255, 209, 102, 0.9),
        0 0 38px rgba(255, 209, 102, 0.4);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .interaction-zone {
      display: grid;
      grid-template-columns: repeat(4, 68px);
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 18px auto 26px;
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .interaction-zone.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .reveal-btn {
      margin: 26px auto 0;
      border: 1px solid rgba(255, 215, 107, 0.5);
      background: rgba(255, 215, 107, 0.12);
      color: var(--gold-2);
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 0.9rem;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.2);
    }

    .reveal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(255, 209, 102, 0.3);
    }

    .clickable-object {
      width: 64px;
      height: 64px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: var(--gold-2);
      font-size: 1.7rem;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .clickable-object:hover,
    .clickable-object.active {
      transform: translateY(-5px) scale(1.08);
      background: rgba(255, 215, 107, 0.18);
      box-shadow: 0 0 22px rgba(255, 209, 102, 0.45);
    }

    .star-object { color: #ffe699; }
    .heart-object { color: #ff9bb4; }
    .moon-object { color: #e6ddff; }
    .note-object { color: #d7ffb0; }
    .flower-object { color: #ffb7d5; }
    .comet-object { color: #a9e9ff; }
    .gift-object { color: #ffca8a; }
    .coffee-object { color: #d6ae8a; }

    .letter-card {
      margin: 18px auto 0;
      max-width: 620px;
      padding: 22px 22px 18px;
      border-radius: 20px;
      background: rgba(18, 22, 43, 0.66);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 18px rgba(255, 215, 107, 0.06);
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .letter-card.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .letter-label {
      margin: 0 0 8px;
      font-size: 0.78rem;
      letter-spacing: 0.18rem;
      text-transform: uppercase;
      color: var(--gold-2);
      opacity: 0.9;
    }

    .letter-card p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #f9f3ff;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(26px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sway {
      from { transform: rotate(-7deg) translateY(4px); }
      to   { transform: rotate(7deg) translateY(-4px); }
    }

    @media (max-width: 600px) {
      .letter {
        padding: 50px 7% 36px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery img {
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="container">
    <section class="letter" aria-label="Carta para ti">
      <div class="moon"></div>
      <div class="sparkle">✦ · ✧ · ✦</div>
      <h1>Para ti, mi flor en la noche</h1>
      <p>Que tu vida esté llena de estrellas, sueños bonitos y momentos que te hagan sonreír como si el cielo te regalara un beso.</p>
      <p class="hint">Presiona el disco de vinilo para despertar la noche ♡</p>

      <div class="turntable">
        <button class="vinyl" id="vinylBtn" aria-label="Ir a la página de flores"></button>
      </div>

      <button class="reveal-btn" id="revealObjects" type="button">Descubre lo escondido</button>

      <div class="interaction-zone" aria-label="Objetos interactivos">
        <button class="clickable-object star-object" aria-label="Estrella" data-message="Isaac te debe un plato de sushi por hacer que cada día se vea más bonito y más divertido." type="button">✦</button>
        <button class="clickable-object heart-object" aria-label="Corazón" data-message="Isaac te debe una noche de películas, palomitas y una cita con la mejor compañía del mundo." type="button">♥</button>
        <button class="clickable-object moon-object" aria-label="Luna" data-message="Isaac te debe un paseo " type="button">☾</button>
        <button class="clickable-object note-object" aria-label="Nota musical" data-message="Isaac te debe una charla de esas que arreglan el mundo y estar ahí en primera fila por cada momento en que te haga reír." type="button">♫</button>
        <button class="clickable-object flower-object" aria-label="Flor" data-message="Isaac te debe un ramo de flores y una tarde entera para hablar de todo y de nada." type="button">❀</button>
        <button class="clickable-object comet-object" aria-label="Cometa" data-message="Isaac te debe una botella." type="button">☄</button>
        <button class="clickable-object gift-object" aria-label="Regalo" data-message="Isaac te debe un regalo sorpresa." type="button">🎁</button>
        <button class="clickable-object coffee-object" aria-label="Café" data-message="Isaac te debe un café, un postre y una conversación que dure hasta que se apaguen las estrellas." type="button">☕</button>
      </div>

      <article class="letter-card" aria-live="polite">
        <p class="letter-label">Mi carta para ti</p>
        <p id="letterText">
          Elige uno de los objetos escondidos para descubrir tu carta.
        </p>
      </article>
    </section>
  </main>

  <audio id="song" loop preload="auto">
    <source src="ENHYPEN (엔하이픈) 'XO (Only If You Say Yes)' Official MV - HYBE LABELS.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const vinylBtn = document.getElementById("vinylBtn");
    const letterText = document.getElementById("letterText");
    const objects = document.querySelectorAll(".clickable-object");
    const revealBtn = document.getElementById("revealObjects");
    const objectZone = document.querySelector(".interaction-zone");
    const letterCard = document.querySelector(".letter-card");

    revealBtn.addEventListener("click", () => {
      objectZone.classList.add("visible");
      revealBtn.style.display = "none";
    });

    vinylBtn.addEventListener("click", () => {
      window.location.href = "flores.html";
    });

    objects.forEach((obj) => {
      obj.addEventListener("click", () => {
        const message = obj.dataset.message;
        letterText.textContent = message;
        letterCard.classList.add("open");

        objects.forEach((item) => item.classList.remove("active"));
        obj.classList.add("active");
      });
    });
  </script>
</body>
</html>
